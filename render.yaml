services:
  - type: web
    name: elos
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        fromDatabase:
          name: elos-db
          property: connectionString
      - key: ADMIN_NAME
        value: "Administrador Principal"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: elos-db
    databaseName: elos
    user: elos_user
