services:
  postgres:
    image: postgres:16-alpine
    container_name: elos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elos_db}
      POSTGRES_USER: ${POSTGRES_USER:-elos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elos_prod_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elos_user} -d ${POSTGRES_DB:-elos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
